<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dấu ấn Gia Long – Hộ chiếu trải nghiệm</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#12302a;--bg2:#1b4037;--paper:#efe3c4;--ink:#2a2418;--brass:#c9a24d;--red:#a63a2a;--ok:#2f6b3f;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--paper);font:16px/1.6 "Be Vietnam Pro",system-ui,sans-serif}
h1,h2,h3{font-family:"Noto Serif",Georgia,serif;margin:0;line-height:1.25}
main{max-width:620px;margin:0 auto;padding:20px 16px 48px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--brass);font-size:14px;margin-bottom:18px}
.pass{background:var(--paper);color:var(--ink);border-radius:6px;padding:22px 20px;border:3px double var(--brass);outline:6px solid var(--bg2)}
.pass h1{font-size:30px}.pass .sub{color:#6b5a38;margin:4px 0 16px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}
.slot{aspect-ratio:1;border:2px dashed #b8a577;border-radius:50%;display:grid;place-items:center;text-align:center;font-size:11px;color:#8a7a52;padding:6px;line-height:1.2}
.slot.on{border:3px solid var(--red);color:var(--red);font-weight:600;transform:rotate(-8deg);background:rgba(166,58,42,.07)}
label.f{display:block;font-weight:600;font-size:14px;margin-top:8px}
input[type=text],textarea{width:100%;font:inherit;padding:10px;border:1px solid #b8a577;background:#fbf5e3;color:var(--ink);border-radius:4px}
.list{display:grid;gap:10px;margin-top:18px}
.stop{display:flex;gap:12px;align-items:center;width:100%;text-align:left;font:inherit;background:var(--bg2);color:var(--paper);border:1px solid var(--brass);border-radius:6px;padding:14px;cursor:pointer}
.stop:disabled{opacity:.5;cursor:not-allowed}
.stop b{display:block;font-family:"Noto Serif",serif;font-size:17px}.stop small{color:#cfc39d}
.stop .tick{margin-left:auto;font-size:22px;color:var(--brass)}
.btn{font:inherit;font-weight:600;background:var(--brass);color:#1d1a10;border:0;border-radius:4px;padding:11px 20px;cursor:pointer;margin-top:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}.btn.ghost{background:none;color:var(--brass);border:1px solid var(--brass)}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
.note{font-size:13px;color:#cfc39d;margin-top:18px}
.q{font-family:"Noto Serif",serif;font-size:19px;margin:6px 0 14px}
.opt{display:block;width:100%;text-align:left;font:inherit;margin-top:8px;padding:12px;border:1px solid #b8a577;background:#fbf5e3;color:var(--ink);border-radius:4px;cursor:pointer}
.opt.good{background:#d5ebd2;border-color:var(--ok)}.opt.bad{background:#f2d4cd;border-color:var(--red)}
.fb{margin-top:12px;font-size:15px;color:#4a3f27}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid #b8a577;background:#fbf5e3;border-radius:4px;margin-top:8px}
.chk input{width:20px;height:20px;margin-top:3px;accent-color:var(--ok)}
.prog{font-size:13px;color:#6b5a38}
.stars{display:flex;gap:6px;margin:8px 0}.stars button{font-size:30px;background:none;border:0;cursor:pointer;color:#b8a577;padding:2px}.stars button.on{color:var(--brass)}
.card{text-align:center;border:3px double var(--brass);outline:6px solid var(--bg2);padding:26px 18px;background:var(--paper);color:var(--ink);border-radius:6px}
.card .seal{font-size:46px}.card h2{font-size:26px;margin:6px 0}
@media (prefers-reduced-motion:no-preference){.slot.on{animation:st .35s ease-out}}
@keyframes st{from{transform:scale(1.5) rotate(-8deg);opacity:0}}
</style>
</head>
<body>
<main id="app"></main>
<script>
var STOPS=[
{n:"Ngôi nhà kể chuyện",t:"20 phút",d:"Công trình xây 1885–1890, từng là Dinh Gia Long trước khi trở thành bảo tàng.",steps:[
{k:"quiz",q:"Công trình được xây dựng trong khoảng thời gian nào?",o:["1785–1790","1885–1890","1935–1940"],a:1,e:"Đúng: công trình xây từ năm 1885 đến 1890."},
{k:"quiz",q:"Kiến trúc sư thiết kế công trình là ai?",o:["Alfred Foulhoux","Gustave Eiffel","Kenzo Tange"],a:0,e:"Đúng: kiến trúc sư Alfred Foulhoux."},
{k:"quiz",q:"Trước khi là bảo tàng, tòa nhà mang tên nào?",o:["Chợ Bến Thành","Dinh Gia Long","Nhà hát Thành phố"],a:1,e:"Đúng: tòa nhà từng là Dinh Gia Long."},
{k:"check",q:"Thợ săn chi tiết: tìm và chụp ảnh 3 chi tiết kiến trúc, rồi đánh dấu khi xong.",i:["Một họa tiết trang trí","Một ô cửa hoặc cửa sổ","Cầu thang hoặc hàng cột"]}]},
{n:"Sài Gòn xưa",t:"25 phút",d:"Buôn bán, tiền tệ, nghề thủ công và lễ hội. Thực hiện nhiệm vụ “Một ngày ở Sài Gòn xưa” và trò chơi “Tiền xưa, giá nay”.",steps:[
{k:"quiz",q:"Trước khi có tiền, người ta trao đổi hàng hóa bằng cách nào?",o:["Hàng đổi hàng","Chuyển khoản","Thẻ tín dụng"],a:0,e:"Đúng: hàng đổi hàng là hình thức trao đổi sơ khai."},
{k:"quiz",q:"Tiền xưa, giá nay: để so sánh giá xưa và nay, ta cần dựa vào điều gì?",o:["Kích thước tờ tiền","Sức mua của đồng tiền thời đó","Màu sắc của tiền"],a:1,e:"Đúng: cần xem một đồng khi ấy mua được bao nhiêu hàng hóa."},
{k:"quiz",q:"Nghề gốm cần nguyên liệu chính nào?",o:["Đất sét","Giấy","Sợi bông"],a:0,e:"Đúng: đất sét là nguyên liệu chính của nghề gốm."},
{k:"check",q:"Một ngày ở Sài Gòn xưa: tìm trong khu trưng bày và đánh dấu khi thấy.",i:["Một hiện vật nghề thủ công","Một loại tiền cũ","Một hình ảnh về lễ hội"]}]},
{n:"Ký ức và kỷ vật kháng chiến",t:"25 phút",d:"Nghe kể chuyện gắn với hiện vật và chia sẻ cảm nhận của đội.",steps:[
{k:"check",q:"Nghe kể chuyện: đánh dấu khi đội đã nghe xong.",i:["Câu chuyện về hiện vật thứ nhất","Câu chuyện về hiện vật thứ hai"]},
{k:"text",q:"Câu hỏi mở: một kỷ vật mà đội vừa nghe gợi cho các bạn điều gì về con người thời đó? Viết 1–2 câu."}]}
];
var S={team:"",done:[false,false,false,false],pts:0,view:"home",stop:0,step:0,rate:0};
var $=function(h){document.getElementById("app").innerHTML=h};
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function count(){return S.done.filter(Boolean).length}
function slots(){var l=["Ngôi nhà","Sài Gòn xưa","Kỷ vật","Kết thúc"];return '<div class="slots">'+l.map(function(x,i){return '<div class="slot'+(S.done[i]?' on':'')+'">'+(S.done[i]?'ĐÃ ĐÓNG DẤU<br>'+x:x)+'</div>'}).join("")+'</div>'}
function bar(){return '<div class="bar"><span>Bảo tàng TP. Hồ Chí Minh</span><span>'+count()+'/4 con dấu · '+S.pts+' điểm</span></div>'}
function home(){S.view="home";
var l=STOPS.map(function(s,i){return '<button class="stop" data-s="'+i+'"><div><b>Trạm '+(i+1)+': '+s.n+'</b><small>'+s.t+'</small></div><span class="tick">'+(S.done[i]?'✓':'›')+'</span></button>'}).join("");
var fin='<button class="stop" id="fin"'+(count()<3?' disabled':'')+'><div><b>Kết thúc: Tổng kết hành trình</b><small>'+(count()<3?'Mở khi đủ 3 con dấu ở các trạm':'Đánh giá và nhận thẻ kỷ niệm')+'</small></div><span class="tick">'+(S.done[3]?'✓':'›')+'</span></button>';
$(bar()+'<section class="pass"><h1>Dấu ấn Gia Long</h1><p class="sub">Hộ chiếu trải nghiệm · Giải mã Sài Gòn xưa</p>'+
(S.team?'<p>Đội: <b>'+esc(S.team)+'</b></p>':'<label class="f" for="tn">Tên đội của bạn</label><input type="text" id="tn" maxlength="30" placeholder="Ví dụ: Đội Gia Định">')+
slots()+'<p>Đi qua ba trạm, chơi các trò chơi nhỏ và thu đủ bốn con dấu để nhận thẻ kỷ niệm. Chơi các trạm theo thứ tự nào cũng được.</p></section><div class="list">'+l+fin+'</div><p class="note">Hình và câu hỏi trong bản chơi thử này là minh họa. Khi đi tour thật, hiện vật, đoạn âm thanh và chi tiết kiến trúc do bảo tàng chọn và thẩm định.</p>');
document.querySelectorAll("[data-s]").forEach(function(b){b.onclick=function(){var t=document.getElementById("tn");if(t){S.team=t.value.trim()||"Đội khách"}S.stop=+b.dataset.s;S.step=0;step()}});
var f=document.getElementById("fin");if(f)f.onclick=finale}
function step(){S.view="stop";var st=STOPS[S.stop],p=st.steps[S.step],h=bar()+'<section class="pass"><h2>Trạm '+(S.stop+1)+': '+st.n+'</h2><p class="prog">Bước '+(S.step+1)+'/'+st.steps.length+'</p>';
if(S.step===0&&p.k!=="x")h+='<p>'+st.d+'</p>';
h+='<p class="q">'+p.q+'</p>';
if(p.k==="quiz")h+=p.o.map(function(o,i){return '<button class="opt" data-o="'+i+'">'+o+'</button>'}).join("")+'<div class="fb" id="fb" aria-live="polite"></div>';
if(p.k==="check")h+=p.i.map(function(o,i){return '<label class="chk"><input type="checkbox" class="cb"> <span>'+o+'</span></label>'}).join("");
if(p.k==="text")h+='<textarea id="tx" rows="4" placeholder="Viết cảm nhận của đội (ít nhất 10 ký tự)"></textarea>';
h+='<button class="btn" id="nx" disabled>Tiếp tục</button> <button class="btn ghost" id="bk">Về hộ chiếu</button></section>';$(h);
var nx=document.getElementById("nx");document.getElementById("bk").onclick=home;
if(p.k==="quiz"){var lock=false;document.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){if(lock)return;lock=true;var i=+b.dataset.o;
document.querySelectorAll(".opt")[p.a].classList.add("good");if(i===p.a){S.pts+=2;document.getElementById("fb").textContent=p.e+" +2 điểm"}else{b.classList.add("bad");document.getElementById("fb").textContent="Chưa đúng. "+p.e}nx.disabled=false}})}
if(p.k==="check"){var up=function(){nx.disabled=!Array.prototype.every.call(document.querySelectorAll(".cb"),function(c){return c.checked})};document.querySelectorAll(".cb").forEach(function(c){c.onchange=up});}
if(p.k==="text"){document.getElementById("tx").oninput=function(e){nx.disabled=e.target.value.trim().length<10}}
nx.onclick=function(){if(p.k==="check")S.pts+=3;if(p.k==="text")S.pts+=3;
if(S.step<st.steps.length-1){S.step++;step()}else{S.done[S.stop]=true;stamp()}}}
function stamp(){var st=STOPS[S.stop];$(bar()+'<section class="pass" style="text-align:center"><div class="slots" style="max-width:150px;margin:0 auto 12px;grid-template-columns:1fr"><div class="slot on">ĐÃ ĐÓNG DẤU<br>'+st.n+'</div></div><h2>Nhận con dấu '+count()+'/4</h2><p>Đội đã hoàn thành trạm “'+st.n+'”.</p><button class="btn" id="ok">Về hộ chiếu</button></section>');document.getElementById("ok").onclick=home}
function finale(){S.view="fin";var st=[1,2,3,4,5].map(function(n){return '<button data-r="'+n+'" aria-label="'+n+' sao" class="'+(S.rate>=n?'on':'')+'">★</button>'}).join("");
$(bar()+'<section class="pass"><h2>Tổng kết hành trình</h2><p>Nghỉ chân một lát. Đội đã đi qua ba trạm và thu được '+S.pts+' điểm. Hãy đánh giá chương trình để nhận con dấu cuối.</p><div class="stars" role="group" aria-label="Đánh giá">'+st+'</div><label class="f" for="fd">Điều đọng lại nhất với đội (không bắt buộc)</label><textarea id="fd" rows="3"></textarea><button class="btn" id="go"'+(S.rate?'':' disabled')+'>Nhận thẻ kỷ niệm</button> <button class="btn ghost" id="bk">Về hộ chiếu</button></section>');
document.getElementById("bk").onclick=home;document.querySelectorAll("[data-r]").forEach(function(b){b.onclick=function(){S.rate=+b.dataset.r;finale()}});
document.getElementById("go").onclick=function(){S.done[3]=true;S.pts+=2;souvenir()}}
function souvenir(){var t=S.pts>=22?"Người giữ ký ức Sài Gòn":S.pts>=14?"Nhà thám hiểm lịch sử":"Khách quen của bảo tàng";
$(bar()+'<div class="card"><div class="seal">🏛️</div><p class="prog">Thẻ kỷ niệm · Bảo tàng TP. Hồ Chí Minh</p><h2>'+esc(t)+'</h2><p>Đội <b>'+esc(S.team||"Đội khách")+'</b> đã thu đủ 4 con dấu Gia Long với <b>'+S.pts+'</b> điểm.</p>'+slots()+'<p>Gợi ý tiếp theo: ghé các điểm di sản lân cận để khám phá thêm Sài Gòn xưa.</p><button class="btn" id="rs">Chơi lại</button></div>');
document.getElementById("rs").onclick=function(){S={team:"",done:[false,false,false,false],pts:0,view:"home",stop:0,step:0,rate:0};home()}}
home();
</script>
</body>
</html>
